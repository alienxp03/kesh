# kesh project config
# Generated by kesh init.
# Cleanup needs no config.

workspaces:
  - name: kesh
    repo: .
    # Panes define the layout and commands used when opening this workspace.
    panes:
      - commands:
          - nvim
        focus: true
      - split: horizontal # omit commands to open an interactive shell
      - commands:
          - codex
        split: vertical # splits the immediately preceding pane


