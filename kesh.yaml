# kesh project config
# Generated by kesh init.

# worktree_dir: ~/workspace/worktrees
# workspace_mode: single

workspaces:
  - name: kesh
    repo: ~/Workspace/Projects/kesh
    panes:
      - commands:
          - nvim
        focus: true
      - split: horizontal
      - commands:
          - pix
        split: vertical

  - name: dotfiles
    repo: .
    panes:
      - commands:
          - nvim
        focus: true
      - split: horizontal
      - commands:
          - cox
        split: vertical
